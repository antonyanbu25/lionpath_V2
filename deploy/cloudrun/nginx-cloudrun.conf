server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache shell HTML or theme bootstrap (avoids stale splash/theme after deploy)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /theme.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Cached assets (not HTML — pages like about.html use location / below)
    location ~* \.(js|mjs|css|svg|png|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # All static pages and SPA fallback (index.html, about.html, qc-preview.html, …)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
