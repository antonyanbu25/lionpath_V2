server {
    listen 8788;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cached assets (not HTML — pages like about.html use location / below)
    location ~* \.(js|css|svg|png|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # All static pages and SPA fallback (index.html, about.html, qc-preview.html, …)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
