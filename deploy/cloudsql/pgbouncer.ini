# PgBouncer configuration for Janus Cloud SQL access from Cloud Run
#
# pool_mode = transaction is REQUIRED by the v9 spec and by this migration:
# RLS session variables are applied with SET LOCAL, which only survives for
# the duration of an explicit transaction. With transaction pooling, every
# RLS-scoped unit of work must be wrapped in BEGIN ... COMMIT by the worker
# (see worker/src/data/persistence/session-context.ts).

[databases]
janus = host=127.0.0.1 port=5432 dbname=janus   # via Cloud SQL Auth Proxy sidecar

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 400
default_pool_size = 20
reserve_pool_size = 5

# Cloud Run sizing rule: (max instances) x (default_pool_size) must stay below
# the Cloud SQL max_connections for the instance tier. db-custom-2-7680
# defaults to ~100 connections: e.g. 4 max instances x 20 pool = 80 < 100.

# Never leak SET LOCAL across clients: transaction mode resets session state
# at transaction end by definition; do NOT enable ignore_startup_parameters
# tricks that would carry GUCs across statements.
server_reset_query = DISCARD ALL
server_reset_query_always = 1

log_connections = 1
log_disconnections = 1
