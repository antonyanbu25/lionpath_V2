name = "prep-portal"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Public/non-secret config. Secrets are set with `wrangler secret put`.
[vars]
# LLM provider for pre-call prep. "gemini" | "anthropic" | "ollama" (see src/providers/).
LLM_PROVIDER = "gemini"
# Model id (provider-specific). gemini-3.1-flash-lite = GA on AI Studio keys + google_search grounding.
MODEL = "gemini-3.1-flash-lite"
# Reasoning depth: low | medium | high | xhigh | max. medium = balanced prep quality/speed.
EFFORT = "medium"
# Post-call: structured JSON scorecard — no web search; lite model is enough and ~2× faster.
POSTCALL_LLM_PROVIDER = "gemini"
POSTCALL_MODEL = "gemini-3.1-flash-lite"
POSTCALL_EFFORT = "low"
# Comma-separated allowed origins for CORS. Include both localhost and 127.0.0.1 for local dev.
ALLOWED_ORIGINS = "http://localhost:8788,http://127.0.0.1:8788,https://lionpath.benjaminsquare.com"
# Restrict sign-in to this email domain. Empty = allow any verified Google account.
ALLOWED_EMAIL_DOMAIN = "freshworks.com"
# Firebase project id — used to verify ID tokens (audience/issuer check).
# Must match web/firebase-config.local.js projectId. See docs/FIREBASE_SETUP.md.
FIREBASE_PROJECT_ID = ""

# Post-call history per SE email (survives incognito — reload on sign-in).
# Create on deploy: wrangler kv namespace create HISTORY_KV
# Then replace id / preview_id below and run: wrangler kv namespace create HISTORY_KV --preview
[[kv_namespaces]]
binding = "HISTORY_KV"
id = "00000000000000000000000000000001"
preview_id = "00000000000000000000000000000002"

# Secrets (set via CLI, never committed):
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put ZOOM_CLIENT_SECRET
# Zoom OAuth (optional — phase 2):
# ZOOM_CLIENT_ID = ""
# ZOOM_CLIENT_SECRET = ""   # use secret put, not vars
# ZOOM_REDIRECT_URI = "http://localhost:8787/api/zoom/callback"
