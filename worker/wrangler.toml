name = "prep-portal"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Public/non-secret config. Secrets are set with `wrangler secret put`.
[vars]
# LLM provider. "anthropic" implemented; add adapters in src/providers/ for "gemini", "ollama", etc.
LLM_PROVIDER = "anthropic"
# Model id (provider-specific). Sonnet 5 = fast + strong for this task; "claude-opus-4-8" for max quality.
MODEL = "claude-sonnet-5"
# Reasoning depth: low | medium | high | xhigh | max. medium balances speed and synthesis quality.
EFFORT = "medium"
# Comma-separated allowed origins for CORS (the Pages URL(s)). "*" only for local dev.
ALLOWED_ORIGINS = "http://localhost:8788"
# Restrict sign-in to this email domain. Empty = allow any verified Google account.
ALLOWED_EMAIL_DOMAIN = "freshworks.com"
# Firebase project id — used to verify ID tokens (audience/issuer check).
FIREBASE_PROJECT_ID = ""

# Secrets (set via CLI, never committed):
#   wrangler secret put ANTHROPIC_API_KEY
