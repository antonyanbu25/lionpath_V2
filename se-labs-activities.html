<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SE Labs · Activities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     SE Labs design tokens — re-toned to TIRAMISU.
     Neutrals / card / shadow / radii are unchanged from the app.
     Only the teal accent is swapped for coffee/cocoa.
     ============================================================ */
  :root{
    --bg:#fdfcfa; --sidebar:#f2ede3; --card:#ffffff;
    --ink:#2b2926; --ink-soft:#4a463f; --muted:#6f6759; --muted2:#7c7466; --faint:#a49a88; --faint2:#8a8072;
    --border:#ece7de; --divider:#f4f0e8; --nav-active:#e5ded1; --nav-hover:#ebe5da; --sidebar-div:#e5dfd2; --userchip:#ece6db;
    --shadow:0 1px 2px rgba(43,41,38,.03);
    --row-hover:#faf8f4;

    /* tiramisu accent (was teal) */
    --accent:#a06a41; --accent-d:#8a5836;
    --link:#8a5a3c; --link-d:#6f4830;
    --accent-chip-bg:#efe3d5; --accent-tint:#f6efe6; --accent-border:#e3d3bf;

    /* semantic (warm) */
    --amber:#a9782a; --amber-bg:#f8efdf; --amber-bd:#ecd9b0;
    --red:#b8544a; --red-dot:#c9564b;
    --olive:#6a7a48; --olive-bg:#eef0e0;
    --clay:#b0785b; --clay-bg:#f4e7df;

    /* icon tiles */
    --tile-mocha-bg:#efe3d5; --tile-mocha:#8a5a3c;
    --tile-espresso-bg:#e6dbd0; --tile-espresso:#6f4a34;
    --tile-sand-bg:#f3ecda; --tile-sand:#a5883f;
    --tile-clay-bg:#f4e7df; --tile-clay:#b0785b;
    --tile-taupe-bg:#ece8de; --tile-taupe:#877b63;

    --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
    --sans:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  a{color:var(--link);text-decoration:none}
  a:hover{color:var(--link-d)}
  button{font-family:inherit;cursor:pointer}
  svg{display:block;flex-shrink:0}

  .shell{display:flex;min-height:100vh}

  /* ---------------- SIDEBAR ---------------- */
  .side{box-sizing:border-box;width:250px;flex-shrink:0;background:var(--sidebar);display:flex;flex-direction:column;padding:26px 0 18px;position:sticky;top:0;height:100dvh;overflow:hidden}
  .brand{display:flex;align-items:center;gap:11px;padding:0 20px 24px}
  .brand-mark{flex-shrink:0;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,#6f4a34 0%, #a06a41 55%, #caa15f 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
  .brand-mark i{width:14px;height:14px;border-radius:4px;background:#fbf3e7;box-shadow:inset 0 0 0 2px rgba(111,74,52,.18)}
  .brand-name{font-size:16px;font-weight:800;letter-spacing:-0.03em;color:var(--ink);line-height:1.05}
  .brand-sub{font-size:11.5px;font-weight:500;color:var(--faint2);letter-spacing:.01em}
  .brand-txt{display:flex;flex-direction:column;min-width:0}

  .nav{display:flex;flex-direction:column;gap:2px;padding:0 12px;flex:1 1 0;min-height:0;overflow-y:auto}
  .navitem{display:flex;align-items:center;gap:12px;text-align:left;padding:11px 14px;border:none;border-radius:11px;font-size:14.5px;min-height:44px;background:transparent;color:#57514a;font-weight:600;width:100%}
  .navitem:hover{background:var(--nav-hover)}
  .navitem .ic{width:18px;color:var(--muted2)}
  .navitem.active{background:var(--nav-active);color:var(--ink);font-weight:700}
  .navitem.active .ic{color:var(--ink)}
  .nav-div{height:1px;background:var(--sidebar-div);margin:12px 14px}
  .nav-lbl{white-space:nowrap}

  .side-foot{flex-shrink:0;padding:14px 14px 0}
  .userchip{display:flex;align-items:center;gap:11px;padding:12px;border-radius:12px;background:var(--userchip)}
  .userchip .av{width:34px;height:34px;border-radius:50%;background:#ddd4c4;color:#57514a;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .userchip .who{display:flex;flex-direction:column;min-width:0;flex:1}
  .userchip .who b{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .userchip .who span{font-size:11.5px;color:var(--muted)}
  .userchip .chev{color:var(--muted2)}

  /* ---------------- MAIN ---------------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
  .header{display:flex;align-items:center;gap:12px;padding:20px 34px 0}
  .header .today{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
  .header .today .eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .header .today .date{font-size:14px;font-weight:600;color:#57514a}
  .searchbox{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:11px;padding:0 12px;background:#fff;height:44px;width:300px;box-shadow:var(--shadow)}
  .searchbox .ic{color:var(--muted2)}
  .searchbox .ph{flex:1;font-size:13.5px;color:var(--muted2)}
  .searchbox .kbd{font-family:var(--mono);font-size:11px;color:var(--muted2);background:#f6f3ee;border-radius:6px;padding:3px 7px}
  .btn{display:flex;align-items:center;gap:7px;height:44px;padding:0 15px;border-radius:11px;font-size:13.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:var(--shadow)}
  .btn-primary:hover{background:var(--accent-d);border-color:var(--accent-d)}
  .btn-outline{background:#fff;color:var(--link);border-color:var(--accent-border)}
  .btn-outline:hover{background:var(--accent-tint)}
  .btn-icon{width:44px;height:44px;flex-shrink:0;border-radius:11px;border:1px solid var(--border);background:#fff;color:#57514a;position:relative;display:flex;align-items:center;justify-content:center}
  .btn-icon .dot{position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--red-dot);border:1.5px solid #fff}

  .content{flex:1;padding:26px 34px 44px;display:flex;flex-direction:column;gap:20px}
  h1{font-size:29px;font-weight:700;letter-spacing:-0.032em;color:var(--ink)}

  /* filters */
  .filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .filter{display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 12px 0 14px;border:1px solid var(--border);border-radius:10px;background:#fff;box-shadow:var(--shadow);position:relative}
  .filter .flabel{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  .filter select{appearance:none;border:none;background:transparent;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink);padding-right:16px;cursor:pointer;outline:none}
  .filter .car{position:absolute;right:12px;width:7px;height:7px;border-right:2px solid var(--muted2);border-bottom:2px solid var(--muted2);transform:translateY(-2px) rotate(45deg);pointer-events:none}

  /* KPI cards */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:104px}
  .kpi .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .kpi .klabel{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .tile{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .kpi .bot{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .kpi .val{font-size:34px;font-weight:700;letter-spacing:-0.035em;line-height:1;color:var(--ink)}
  .kpi .val u{font-size:15px;font-weight:600;color:var(--faint);letter-spacing:0;font-style:normal;margin-left:2px}
  .kpi .delta{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;text-align:right}

  /* Feed card */
  .feed{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .feed-head{display:flex;align-items:baseline;justify-content:space-between;padding:20px 22px 14px}
  .feed-head h2{font-size:17px;font-weight:700;letter-spacing:-0.02em;color:var(--ink)}
  .feed-head .sub{font-size:13px;font-weight:600;color:var(--muted2)}

  .twrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:980px}
  thead th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 22px;border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:13px 22px;border-bottom:1px solid var(--divider);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:var(--row-hover)}

  .act{display:flex;align-items:center;gap:12px;min-width:230px}
  .act .tile{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .act .meta{display:flex;flex-direction:column;gap:4px;min-width:0}
  .act .name{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;width:fit-content}
  .badge.analyzed{background:var(--accent-chip-bg);color:var(--link)}
  .badge.brief{background:#f1ece3;border:1px solid #eae3d6;color:#877b63}

  .c-type{font-size:13px;color:var(--muted)}
  .c-acct{font-size:13.5px;font-weight:600;color:var(--ink)}
  .c-date{font-size:13px;color:var(--muted)}
  .c-len{font-family:var(--mono);font-size:12.5px;color:#57514a;white-space:nowrap}
  .dash{color:var(--faint)}

  .q{display:flex;align-items:center;gap:9px;min-width:140px}
  .q .num{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--link);white-space:nowrap}
  .q .num s{color:var(--faint);text-decoration:none}
  .q .bar{flex:1;min-width:56px;height:8px;border-radius:5px;background:var(--divider);overflow:hidden}
  .q .fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#6f4a34,#a06a41 55%,#caa15f)}

  .tags{display:flex;flex-wrap:wrap;gap:6px;max-width:240px}
  .tag{font-size:11px;font-weight:600;color:#57514a;background:#f1ece3;border:1px solid #eae3d6;border-radius:20px;padding:3px 9px;white-space:nowrap}
  .tag.risk{color:var(--clay);background:var(--clay-bg);border-color:#ecd7c9}

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  /* responsive */
  @media(max-width:1080px){
    .kpis{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:820px){
    .side{width:74px}
    .brand-txt,.nav-lbl,.userchip .who,.userchip .chev{display:none}
    .brand{justify-content:center;padding:0 0 24px}
    .navitem{justify-content:center;padding:11px}
    .userchip{justify-content:center;padding:8px}
    .header,.content{padding-left:20px;padding-right:20px}
    .searchbox{width:auto;flex:1}
  }
  @media(max-width:560px){
    .kpis{grid-template-columns:1fr}
    .header{flex-wrap:wrap}
    .searchbox{order:3;flex-basis:100%}
  }
</style>
</head>
<body>
<div class="shell">

  <!-- SIDEBAR -->
  <aside class="side">
    <div class="brand">
      <span class="brand-mark"><i></i></span>
      <span class="brand-txt">
        <span class="brand-name">SE Labs</span>
        <span class="brand-sub">Solution Engineering</span>
      </span>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="side-foot">
      <div class="userchip">
        <span class="av">NN</span>
        <span class="who"><b>NIVEDHA Natarajan</b><span>Solution Engineer</span></span>
        <span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="header">
      <div class="today">
        <span class="eyebrow">Saturday</span>
        <span class="date">8 August 2026</span>
      </div>
      <div class="searchbox">
        <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
        <span class="ph">Search…</span>
        <span class="kbd">⌘K</span>
      </div>
      <button class="btn btn-primary"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New brief</button>
      <button class="btn btn-outline"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New call analysis</button>
      <button class="btn-icon" aria-label="Notifications"><span class="dot"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg></button>
    </header>

    <main class="content">
      <h1>Activities</h1>

      <div class="filters">
        <label class="filter">
          <span class="flabel">Type</span>
          <select aria-label="Activity type">
            <option>All activity</option>
            <option>Pre-call briefs</option>
            <option>Analyzed calls</option>
          </select>
          <span class="car"></span>
        </label>
        <label class="filter">
          <span class="flabel">When</span>
          <select aria-label="Date window">
            <option>All time</option>
            <option>This week</option>
            <option>This month</option>
            <option>This quarter</option>
          </select>
          <span class="car"></span>
        </label>
      </div>

      <section class="kpis" id="kpis"></section>

      <section class="feed">
        <div class="feed-head">
          <h2>Activity feed</h2>
          <span class="sub" id="feedSub"></span>
        </div>
        <div class="twrap">
          <table>
            <thead>
              <tr>
                <th>Activity</th>
                <th>Type</th>
                <th>Account</th>
                <th>Deal</th>
                <th>Date</th>
                <th>Length</th>
                <th>Call quality</th>
                <th>Technical commit moved</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
/* ============================================================
   Icons (Lucide-style, matching the app's icon set)
   ============================================================ */
const ICON = {
  dashboard:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  brief:'<path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/>',
  analysis:'<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m7 14 3-3 3 3 5-5"/>',
  history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
  building:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M9 6h.01M15 6h.01M9 10h.01M15 10h.01M9 14h.01M15 14h.01"/>',
  deal:'<circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/>',
  contacts:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  coaching:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  settings:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  sparkle:'<path d="M9.94 14.06 5 19m5.06-9.94L5 4m9 5.94L19 5m-4.94 9.06L19 19"/><circle cx="12" cy="12" r="3.2"/>'
};
function svg(name, size){
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+ICON[name]+'</svg>';
}

/* ============================================================
   Nav
   ============================================================ */
const NAV_MAIN = [['Dashboard','dashboard'],['Pre-call brief','brief'],['Post-call analysis','analysis'],['Activities','history']];
const NAV_SEC  = [['Accounts','building'],['My deals','deal'],['My contacts','contacts'],['My coaching','coaching'],['Settings','settings']];
function navHTML(list){
  return list.map(function(x){
    var active = x[0]==='Activities';
    return '<button class="navitem'+(active?' active':'')+'"><span class="ic">'+svg(x[1],18)+'</span><span class="nav-lbl">'+x[0]+'</span></button>';
  }).join('');
}
document.getElementById('nav').innerHTML =
  navHTML(NAV_MAIN) + '<div class="nav-div"></div>' + navHTML(NAV_SEC);

/* ============================================================
   THE FIX for the "not rendered properly" column.
   Raw commit keys (incumbent, competitor, identifiedRisk) are
   mapped to display labels here, at the render boundary — this
   is the map to lift straight into LionPath.
   ============================================================ */
const TC_LABELS = {
  incumbent:      'Incumbent',
  competitor:     'Competitor',
  identifiedRisk: 'Identified risk',
  budget:         'Budget',
  timeline:       'Timeline',
  decisionMaker:  'Decision maker',
  techFit:        'Technical fit',
  useCase:        'Use case'
};
const TC_RISKY = { identifiedRisk:true }; // rendered in the clay/cocoa colour

/* ============================================================
   Data. Every pre-call brief counts as a flat 15 minutes.
   ============================================================ */
const BRIEF_MINUTES = 15;
const DATA = [
  {kind:'analyzed', name:'Gamersheek', badge:'Demo', type:'Demo', account:'Gamersheek', deal:null, date:'8 Aug', min:33, score:0.0, tc:['incumbent','competitor','identifiedRisk']},
  {kind:'brief', name:'Gamersheek', type:'Discovery', account:'Gamersheek', deal:null, date:'8 Aug'},
  {kind:'brief', name:'Gamersheek', type:'Discovery', account:'Gamersheek', deal:null, date:'8 Aug'},
  {kind:'brief', name:'Gamersheek', type:'Discovery', account:'Gamersheek', deal:null, date:'8 Jul'},
  {kind:'brief', name:'Gamersheek', type:'Discovery', account:'Gamersheek', deal:null, date:'8 Jul'},
  {kind:'brief', name:'Gamersheek', type:'Discovery', account:'Gamersheek', deal:null, date:'8 Jul'},
  {kind:'brief', name:'Gamersheek', type:'Discovery', account:'Gamersheek', deal:null, date:'8 Jul'},

];
function minutesOf(a){ return a.kind==='brief' ? BRIEF_MINUTES : (a.min||0); }

/* ============================================================
   KPIs — computed from the data (so the 15-min rule is live)
   ============================================================ */
(function(){
  var total = DATA.length;
  var briefs = DATA.filter(function(a){return a.kind==='brief';}).length;
  var analyzed = DATA.filter(function(a){return a.kind==='analyzed';});
  var mins = DATA.reduce(function(s,a){return s+minutesOf(a);},0);
  var hours = (mins/60);
  var avg = analyzed.length ? analyzed.reduce(function(s,a){return s+(a.score||0);},0)/analyzed.length : 0;
  var accounts = new Set(DATA.map(function(a){return a.account;})).size;

  var cards = [
    {label:'Activities', icon:'history', tile:'mocha',
      valTop:String(total), valUnit:'', delta:briefs+' briefs · '+analyzed.length+' call'},
    {label:'Hours invested', icon:'clock', tile:'espresso',
      valTop:hours.toFixed(1), valUnit:'h', delta:'briefs counted at 15m'},
    {label:'Avg call quality', icon:'sparkle', tile:'sand',
      valTop:avg.toFixed(1), valUnit:'/10', delta:'from '+analyzed.length+' call · v2.1'},
    {label:'Accounts in play', icon:'building', tile:'taupe',
      valTop:String(accounts), valUnit:'', delta:'with activity this period'}
  ];

  document.getElementById('kpis').innerHTML = cards.map(function(k){
    var tileBg='var(--tile-'+k.tile+'-bg)', tileFg='var(--tile-'+k.tile+')';
    var unit = k.valUnit ? '<u>'+k.valUnit+'</u>' : '';
    return '<div class="kpi">'+
      '<div class="top"><span class="klabel">'+k.label+'</span>'+
        '<span class="tile" style="background:'+tileBg+';color:'+tileFg+'">'+svg(k.icon,20)+'</span></div>'+
      '<div class="bot"><span class="val">'+k.valTop+unit+'</span>'+
        '<span class="delta">'+k.delta+'</span></div>'+
    '</div>';
  }).join('');

  document.getElementById('feedSub').textContent = total+' activities · newest first';
})();

/* ============================================================
   Feed rows
   ============================================================ */
function tcHTML(keys){
  if(!keys || !keys.length) return '<span class="dash">—</span>';
  return '<div class="tags">'+keys.map(function(k){
    var label = TC_LABELS[k] || k;               // never show the raw key
    var cls = TC_RISKY[k] ? 'tag risk' : 'tag';
    return '<span class="'+cls+'">'+label+'</span>';
  }).join('')+'</div>';
}
function qualityHTML(a){
  if(a.kind!=='analyzed') return '<span class="dash">—</span>';
  var pct = Math.max(0, Math.min(100, (a.score/10)*100));
  return '<div class="q"><span class="num">'+a.score.toFixed(1)+'<s>/10</s></span>'+
    '<span class="bar"><span class="fill" style="width:'+pct+'%"></span></span></div>';
}
function rowHTML(a){
  var analyzed = a.kind==='analyzed';
  var tileBg = analyzed ? 'var(--tile-mocha-bg)' : 'var(--tile-sand-bg)';
  var tileFg = analyzed ? 'var(--tile-mocha)'    : 'var(--tile-sand)';
  var icon   = analyzed ? 'phone' : 'brief';
  var badge  = analyzed ? '<span class="badge analyzed">Activity</span>' : '<span class="badge brief">Brief</span>';
  var name   = a.name + (a.badge ? ' <span style="color:var(--faint);font-weight:500">· '+a.badge+'</span>' : '');
  var deal   = a.deal ? '<span class="c-acct">'+a.deal+'</span>' : '<span class="dash">—</span>';
  return '<tr>'+
    '<td><div class="act"><span class="tile" style="background:'+tileBg+';color:'+tileFg+'">'+svg(icon,17)+'</span>'+
        '<span class="meta"><span class="name">'+name+'</span>'+badge+'</span></div></td>'+
    '<td class="c-type">'+a.type+'</td>'+
    '<td class="c-acct">'+a.account+'</td>'+
    '<td>'+deal+'</td>'+
    '<td class="c-date">'+a.date+'</td>'+
    '<td class="c-len">'+minutesOf(a)+'m</td>'+
    '<td>'+qualityHTML(a)+'</td>'+
    '<td>'+tcHTML(a.tc)+'</td>'+
  '</tr>';
}
document.getElementById('rows').innerHTML = DATA.map(rowHTML).join('');
</script>
